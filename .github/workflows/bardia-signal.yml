name: BARDIA AI Signal

'on':
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  signal:
    runs-on: ubuntu-latest

    steps:
      - name: Check XAUUSD M5
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import os, requests, math

          key = os.environ["TWELVE_DATA_API_KEY"]
          token = os.environ["TELEGRAM_BOT_TOKEN"]
          chat_id = os.environ["TELEGRAM_CHAT_ID"]

          url = "https://api.twelvedata.com/time_series"
          params = {
              "symbol": "XAU/USD",
              "interval": "5min",
              "outputsize": 260,
              "order": "asc",
              "apikey": key
          }

          data = requests.get(url, params=params, timeout=30).json()

          if "values" not in data:
              raise Exception(str(data))

          bars = []
          for x in data["values"]:
              bars.append({
                  "o": float(x["open"]),
                  "h": float(x["high"]),
                  "l": float(x["low"]),
                  "c": float(x["close"])
              })

          closes = [x["c"] for x in bars]

          def ema(values, period):
              k = 2 / (period + 1)
              e = values[0]
              for v in values[1:]:
                  e = v * k + e * (1-k)
              return e
          # =========================
          # BARDIA AI ADVANCED LAYER
          # =========================

          # دریافت M15 برای تشخیص روند بالاتر
          m15_params = {
              "symbol": "XAU/USD",
              "interval": "15min",
              "outputsize": 120,
              "order": "asc",
              "apikey": key
          }

          m15_data = requests.get(
              url,
              params=m15_params,
              timeout=30
          ).json()

          if "values" not in m15_data:
              raise Exception("M15 DATA ERROR: " + str(m15_data))

          m15_closes = [
              float(x["close"])
              for x in m15_data["values"]
          ]

          m15_ema50 = ema(m15_closes, 50)
          m15_close = m15_closes[-2]

          m15_bull = m15_close > m15_ema50
          m15_bear = m15_close < m15_ema50

          if m15_bull:
              m15_trend = "BULLISH"
          elif m15_bear:
              m15_trend = "BEARISH"
          else:
              m15_trend = "NEUTRAL"

          print(
              f"M15 TREND | {m15_trend} | "
              f"Close={m15_close:.2f} | "
              f"EMA50={m15_ema50:.2f}"
          )
          def rsi(values, period=14):
              gains, losses = [], []
              for i in range(1, len(values)):
                  d = values[i] - values[i-1]
                  gains.append(max(d, 0))
                  losses.append(max(-d, 0))

              ag = sum(gains[-period:]) / period
              al = sum(losses[-period:]) / period

              if al == 0:
                  return 100

              return 100 - (100 / (1 + ag/al))

          def atr(bars, period=14):
              trs = []
              for i in range(1, len(bars)):
                  tr = max(
                      bars[i]["h"] - bars[i]["l"],
                      abs(bars[i]["h"] - bars[i-1]["c"]),
                      abs(bars[i]["l"] - bars[i-1]["c"])
                  )
                  trs.append(tr)

              return sum(trs[-period:]) / period

          ema200 = ema(closes, 200)
          r = rsi(closes, 14)
          a = atr(bars, 14)

          b = bars[-2]
          prev = bars[-3]

          recent_high = max(x["h"] for x in bars[-12:-2])
          recent_low = min(x["l"] for x in bars[-12:-2])

          bull_bos = b["c"] > recent_high
          bear_bos = b["c"] < recent_low

          fvg_bull = (
              bars[-3]["h"] < bars[-1]["l"]
              and (bars[-1]["l"] - bars[-3]["h"]) >= 0.10 * a
          )

          fvg_bear = (
              bars[-3]["l"] > bars[-1]["h"]
              and (bars[-3]["l"] - bars[-1]["h"]) >= 0.10 * a
          )

          ob = bars[-9:-1]

          bull_ob = max(
              (x for x in ob if x["c"] < x["o"]),
              key=lambda x: x["h"],
              default=None
          )

          bear_ob = min(
              (x for x in ob if x["c"] > x["o"]),
              key=lambda x: x["l"],
              default=None
          )

          close = b["c"]

          signal = "WAIT"
          entry = close
          sl = None
          tp1 = None
          tp2 = None
          score = 0

          if close > ema200:
              score += 20

          if r >= 55:
              score += 20

          if bull_bos:
              score += 20

          if fvg_bull:
              score += 20

          if bull_ob:
              score += 20

          if score >= 70 and close > ema200 and r >= 55 and bull_bos and fvg_bull:
              signal = "BUY"

              ob_low = bull_ob["l"] if bull_ob else close
              sl = min(ob_low, close - 1.5*a) - 0.02
              risk = close - sl
              tp1 = close + risk
              tp2 = close + 2*risk

          else:
              score = 0

              if close < ema200:
                  score += 20

              if r <= 45:
                  score += 20

              if bear_bos:
                  score += 20

              if fvg_bear:
                  score += 20

              if bear_ob:
                  score += 20

              if score >= 70 and close < ema200 and r <= 45 and bear_bos and fvg_bear:
                  signal = "SELL"

                  ob_high = bear_ob["h"] if bear_ob else close
                  sl = max(ob_high, close + 1.5*a) + 0.02
                  risk = sl - close
                  tp1 = close - risk
                  tp2 = close - 2*risk

          if signal != "WAIT":
              msg = (
                  f"BARDIA AI\n"
                  f"🚨 {signal} XAUUSD M5\n\n"
                  f"Entry: {entry:.2f}\n"
                  f"SL: {sl:.2f}\n"
                  f"TP1: {tp1:.2f}\n"
                  f"TP2: {tp2:.2f}\n"
                  f"RR: 1:2\n"
                  f"Strength: {score}/100\n"
                  f"RSI: {r:.1f}\n"
                  f"EMA200: {ema200:.2f}"
              )

              tg = f"https://api.telegram.org/bot{token}/sendMessage"
              requests.post(
                  tg,
                  data={"chat_id": chat_id, "text": msg},
                  timeout=30
              )

              print(msg)

          else:
              print(
                  f"WAIT | Entry={close:.2f} | "
                  f"RSI={r:.1f} | EMA200={ema200:.2f}"
              )
          PY
