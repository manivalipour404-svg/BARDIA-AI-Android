name: BARDIA AI Signal

'on':
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  signal:
    runs-on: ubuntu-latest

    steps:
      - name: Check XAUUSD M5
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import os, requests, math

          key = os.environ["TWELVE_DATA_API_KEY"]
          token = os.environ["TELEGRAM_BOT_TOKEN"]
          chat_id = os.environ["TELEGRAM_CHAT_ID"]

          url = "https://api.twelvedata.com/time_series"
          params = {
              "symbol": "XAU/USD",
              "interval": "5min",
              "outputsize": 260,
              "order": "asc",
              "apikey": key
          }

          data = requests.get(url, params=params, timeout=30).json()

          if "values" not in data:
              raise Exception(str(data))

          bars = []
          for x in data["values"]:
              bars.append({
                  "o": float(x["open"]),
                  "h": float(x["high"]),
                  "l": float(x["low"]),
                  "c": float(x["close"])
              })

          closes = [x["c"] for x in bars]

          def ema(values, period):
              k = 2 / (period + 1)
              e = values[0]
              for v in values[1:]:
                  e = v * k + e * (1-k)
              return e
          # =========================
          # BARDIA AI ADVANCED LAYER
          # =========================

          # دریافت M15 برای تشخیص روند بالاتر
          m15_params = {
              "symbol": "XAU/USD",
              "interval": "15min",
              "outputsize": 120,
              "order": "asc",
              "apikey": key
          }

          m15_data = requests.get(
              url,
              params=m15_params,
              timeout=30
          ).json()

          if "values" not in m15_data:
              raise Exception("M15 DATA ERROR: " + str(m15_data))

          m15_closes = [
              float(x["close"])
              for x in m15_data["values"]
          ]

          m15_ema50 = ema(m15_closes, 50)
          m15_close = m15_closes[-2]

          m15_bull = m15_close > m15_ema50
          m15_bear = m15_close < m15_ema50

          if m15_bull:
              m15_trend = "BULLISH"
          elif m15_bear:
              m15_trend = "BEARISH"
          else:
              m15_trend = "NEUTRAL"

          print(
              f"M15 TREND | {m15_trend} | "
              f"Close={m15_close:.2f} | "
              f"EMA50={m15_ema50:.2f}"
          )
          def rsi(values, period=14):
              gains, losses = [], []
              for i in range(1, len(values)):
                  d = values[i] - values[i-1]
                  gains.append(max(d, 0))
                  losses.append(max(-d, 0))

              ag = sum(gains[-period:]) / period
              al = sum(losses[-period:]) / period

              if al == 0:
                  return 100

              return 100 - (100 / (1 + ag/al))

          def atr(bars, period=14):
              trs = []
              for i in range(1, len(bars)):
                  tr = max(
                      bars[i]["h"] - bars[i]["l"],
                      abs(bars[i]["h"] - bars[i-1]["c"]),
                      abs(bars[i]["l"] - bars[i-1]["c"])
                  )
                  trs.append(tr)

              return sum(trs[-period:]) / period

          ema200 = ema(closes, 200)
          r = rsi(closes, 14)
          a = atr(bars, 14)

          # فقط کندل بسته‌شده
          b = bars[-2]

          # -------------------------
          # Market Structure / BOS
          # -------------------------

          recent_high = max(
              x["h"] for x in bars[-12:-2]
          )

          recent_low = min(
              x["l"] for x in bars[-12:-2]
          )

          bull_bos = b["c"] > recent_high
          bear_bos = b["c"] < recent_low

          # -------------------------
          # FVG
          # فقط با کندل‌های بسته‌شده
          # -------------------------

          fvg_bull = (
              bars[-4]["h"] < bars[-2]["l"]
              and
              (bars[-2]["l"] - bars[-4]["h"]) >= 0.10 * a
          )

          fvg_bear = (
              bars[-4]["l"] > bars[-2]["h"]
              and
              (bars[-4]["l"] - bars[-2]["h"]) >= 0.10 * a
          )

          # -------------------------
          # Order Block
          # فقط کندل‌های قبل از سیگنال
          # -------------------------

          ob = bars[-10:-2]

          bull_ob = None
          for x in reversed(ob):
              if x["c"] < x["o"]:
                  bull_ob = x
                  break

          bear_ob = None
          for x in reversed(ob):
              if x["c"] > x["o"]:
                  bear_ob = x
                  break

          close = b["c"]

          signal = "WAIT"
          entry = close
          sl = None
          tp1 = None
          tp2 = None

          # -------------------------
          # BUY SCORE
          # -------------------------

          buy_score = 0

          if close > ema200:
              buy_score += 20

          if m15_trend == "BULLISH":
              buy_score += 20

          if r >= 52:
              buy_score += 15

          if bull_bos:
              buy_score += 25

          if fvg_bull:
              buy_score += 10

          if bull_ob:
              buy_score += 10

          # -------------------------
          # SELL SCORE
          # -------------------------

          sell_score = 0

          if close < ema200:
              sell_score += 20

          if m15_trend == "BEARISH":
              sell_score += 20

          if r <= 48:
              sell_score += 15

          if bear_bos:
              sell_score += 25

          if fvg_bear:
              sell_score += 10

          if bear_ob:
              sell_score += 10

          # -------------------------
          # DIAGNOSTIC
          # -------------------------

          print(
              f"BUY CHECK | Score={buy_score}/100 | "
              f"EMA={'YES' if close > ema200 else 'NO'} | "
              f"M15={'YES' if m15_trend == 'BULLISH' else 'NO'} | "
              f"RSI={'YES' if r >= 52 else 'NO'} | "
              f"BOS={'YES' if bull_bos else 'NO'} | "
              f"FVG={'YES' if fvg_bull else 'NO'} | "
              f"OB={'YES' if bull_ob else 'NO'}"
          )

          print(
              f"SELL CHECK | Score={sell_score}/100 | "
              f"EMA={'YES' if close < ema200 else 'NO'} | "
              f"M15={'YES' if m15_trend == 'BEARISH' else 'NO'} | "
              f"RSI={'YES' if r <= 48 else 'NO'} | "
              f"BOS={'YES' if bear_bos else 'NO'} | "
              f"FVG={'YES' if fvg_bear else 'NO'} | "
              f"OB={'YES' if bear_ob else 'NO'}"
          )

          # -------------------------
          # BUY SIGNAL
          # -------------------------

          if (
              buy_score >= 75
              and close > ema200
              and m15_trend == "BULLISH"
              and r >= 50
              and sum([
                  bull_bos,
                  fvg_bull,
                  bool(bull_ob)
              ]) >= 2
          ):
              signal = "BUY"
              score = buy_score

              ob_low = bull_ob["l"] if bull_ob else close

              sl = min(
                  ob_low,
                  close - 1.5 * a
              ) - 0.02

              risk = close - sl

              if risk > 0:
                  tp1 = close + risk
                  tp2 = close + 2 * risk
              else:
                  signal = "WAIT"

          # -------------------------
          # SELL SIGNAL
          # -------------------------

          elif (
              sell_score >= 75
              and close < ema200
              and m15_trend == "BEARISH"
              and r <= 50
              and sum([
                  bear_bos,
                  fvg_bear,
                  bool(bear_ob)
              ]) >= 2
          ):
              signal = "SELL"
              score = sell_score

              ob_high = bear_ob["h"] if bear_ob else close

              sl = max(
                  ob_high,
                  close + 1.5 * a
              ) + 0.02

              risk = sl - close

              if risk > 0:
                  tp1 = close - risk
                  tp2 = close - 2 * risk
              else:
                  signal = "WAIT"

          # -------------------------
          # FINAL SIGNAL VALIDATION
          # -------------------------

          if signal != "WAIT":
              if sl is None or tp1 is None or tp2 is None:
                  signal = "WAIT"

          # -------------------------
          # TELEGRAM
          # -------------------------

          if signal != "WAIT":
              msg = (
                  f"BARDIA AI\n"
                  f"🚨 {signal} XAUUSD M5\n\n"
                  f"Entry: {entry:.2f}\n"
                  f"SL: {sl:.2f}\n"
                  f"TP1: {tp1:.2f}\n"
                  f"TP2: {tp2:.2f}\n"
                  f"RR: 1:2\n"
                  f"Strength: {score}/100\n"
                  f"RSI: {r:.1f}\n"
                  f"EMA200: {ema200:.2f}\n"
                  f"M15: {m15_trend}"
              )

              tg = f"https://api.telegram.org/bot{token}/sendMessage"

              requests.post(
                  tg,
                  data={
                      "chat_id": chat_id,
                      "text": msg
                  },
                  timeout=30
              )

              print(msg)

          else:
              print(
                  f"WAIT | Entry={close:.2f} | "
                  f"RSI={r:.1f} | EMA200={ema200:.2f} | "
                  f"M15={m15_trend} | "
                  f"M15_Close={m15_close:.2f} | "
                  f"M15_EMA50={m15_ema50:.2f}"
              )
          PY
