name: BARDIA AI Signal

'on':
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  signal:
    runs-on: ubuntu-latest

    steps:
      - name: Check XAUUSD M5
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

        run: |
          python - <<'PY'
          import os
          import requests

          key = os.environ["TWELVE_DATA_API_KEY"]
          token = os.environ["TELEGRAM_BOT_TOKEN"]
          chat_id = os.environ["TELEGRAM_CHAT_ID"]

          url = "https://api.twelvedata.com/time_series"

          # =========================
          # DOWNLOAD M5 DATA
          # =========================

          params = {
              "symbol": "XAU/USD",
              "interval": "5min",
              "outputsize": 260,
              "order": "asc",
              "apikey": key
          }

          response = requests.get(
              url, params=params, timeout=30
          )
          response.raise_for_status()
          data = response.json()

          if "values" not in data:
              raise Exception("M5 DATA ERROR: " + str(data))

          bars = []

          for x in data["values"]:
              bars.append({
                  "o": float(x["open"]),
                  "h": float(x["high"]),
                  "l": float(x["low"]),
                  "c": float(x["close"])
              })

          if len(bars) < 220:
              raise Exception(
                  f"Not enough M5 candles: {len(bars)}"
              )

          # Exclude the currently forming candle
          closed_bars = bars[:-1]
          closes = [x["c"] for x in closed_bars]

          # =========================
          # INDICATOR FUNCTIONS
          # =========================

          def ema(values, period):
              if len(values) < period:
                  raise Exception("Not enough EMA data")

              k = 2 / (period + 1)
              result = values[0]

              for value in values[1:]:
                  result = value * k + result * (1 - k)

              return result

          def rsi(values, period=14):
              gains = []
              losses = []

              for i in range(1, len(values)):
                  change = values[i] - values[i - 1]
                  gains.append(max(change, 0))
                  losses.append(max(-change, 0))

              avg_gain = sum(gains[-period:]) / period
              avg_loss = sum(losses[-period:]) / period

              if avg_loss == 0:
                  return 100 if avg_gain > 0 else 50

              rs = avg_gain / avg_loss
              return 100 - (100 / (1 + rs))

          def atr(bars_data, period=14):
              ranges = []

              for i in range(1, len(bars_data)):
                  current = bars_data[i]
                  previous = bars_data[i - 1]

                  tr = max(
                      current["h"] - current["l"],
                      abs(current["h"] - previous["c"]),
                      abs(current["l"] - previous["c"])
                  )

                  ranges.append(tr)

              if len(ranges) < period:
                  raise Exception("Not enough ATR data")

              return sum(ranges[-period:]) / period

          def atr_at(bars_data, index, period=14):
              ranges = []
              start = max(1, index - period + 1)

              for i in range(start, index + 1):
                  current = bars_data[i]
                  previous = bars_data[i - 1]

                  ranges.append(max(
                      current["h"] - current["l"],
                      abs(current["h"] - previous["c"]),
                      abs(current["l"] - previous["c"])
                  ))

              if not ranges:
                  return bars_data[index]["h"] - bars_data[index]["l"]

              return sum(ranges) / len(ranges)

          # =========================
          # M15 HIGHER-TIMEFRAME TREND
          # =========================

          m15_params = {
              "symbol": "XAU/USD",
              "interval": "15min",
              "outputsize": 120,
              "order": "asc",
              "apikey": key
          }

          m15_response = requests.get(
              url, params=m15_params, timeout=30
          )
          m15_response.raise_for_status()
          m15_data = m15_response.json()

          if "values" not in m15_data:
              raise Exception(
                  "M15 DATA ERROR: " + str(m15_data)
              )

          m15_closes = [
              float(x["close"])
              for x in m15_data["values"]
          ]

          # Use completed M15 candles only
          m15_closed = m15_closes[:-1]

          if len(m15_closed) < 50:
              raise Exception("Not enough closed M15 candles")

          m15_close = m15_closed[-1]
          m15_ema50 = ema(m15_closed, 50)

          if m15_close > m15_ema50:
              m15_trend = "BULLISH"
          elif m15_close < m15_ema50:
              m15_trend = "BEARISH"
          else:
              m15_trend = "NEUTRAL"

          print(
              f"M15 TREND | {m15_trend} | "
              f"Close={m15_close:.2f} | "
              f"EMA50={m15_ema50:.2f}"
          )

          # =========================
          # MAIN STRATEGY INDICATORS
          # =========================

          ema200 = ema(closes, 200)
          r = rsi(closes, 14)
          a = atr(closed_bars, 14)

          # Latest completed M5 candle
          b = closed_bars[-1]
          close = b["c"]

          # =========================
          # MARKET STRUCTURE / BOS
          # =========================

          recent_high = max(
              x["h"] for x in closed_bars[-11:-1]
          )

          recent_low = min(
              x["l"] for x in closed_bars[-11:-1]
          )

          bull_bos = close > recent_high
          bear_bos = close < recent_low

          # =========================
          # FVG
          # =========================

          fvg_bull = (
              closed_bars[-3]["h"] < b["l"]
              and
              (b["l"] - closed_bars[-3]["h"]) >= 0.10 * a
          )

          fvg_bear = (
              closed_bars[-3]["l"] > b["h"]
              and
              (closed_bars[-3]["l"] - b["h"]) >= 0.10 * a
          )

          # =========================
          # ORDER BLOCK
          # =========================

          ob = closed_bars[-9:-1]

          bull_ob = None

          for candle in reversed(ob):
              if candle["c"] < candle["o"]:
                  bull_ob = candle
                  break

          bear_ob = None

          for candle in reversed(ob):
              if candle["c"] > candle["o"]:
                  bear_ob = candle
                  break

          # =========================
          # BTB LAB V0
          # Experimental breakout + retest
          # Does NOT affect the main signal
          # Does NOT send Telegram messages
          # =========================

          def btb_backtest(
              history,
              lookback=20,
              retest_window=10,
              holding_bars=20,
              reward_risk=2.0
          ):
              results = []
              n = len(history)

              # Leave enough candles to evaluate future outcomes
              last_breakout = (
                  n - retest_window - holding_bars - 2
              )

              i = lookback

              while i <= last_breakout:
                  previous = history[i - lookback:i]

                  level_high = max(
                      x["h"] for x in previous
                  )

                  level_low = min(
                      x["l"] for x in previous
                  )

                  candle = history[i]

                  direction = None
                  level = None

                  if candle["c"] > level_high:
                      direction = "BUY"
                      level = level_high

                  elif candle["c"] < level_low:
                      direction = "SELL"
                      level = level_low

                  if direction is None:
                      i += 1
                      continue

                  # Find a confirmed retest after the breakout
                  retest_index = None

                  search_end = min(
                      i + retest_window,
                      n - holding_bars - 2
                  )

                  for j in range(i + 1, search_end + 1):
                      test = history[j]
                      tolerance = max(
                          0.05,
                          0.15 * atr_at(history, j)
                      )

                      touches_level = (
                          test["l"] <= level + tolerance
                          and
                          test["h"] >= level - tolerance
                      )

                      if direction == "BUY":
                          confirmed = (
                              touches_level
                              and test["c"] >= level
                              and test["c"] > test["o"]
                          )
                      else:
                          confirmed = (
                              touches_level
                              and test["c"] <= level
                              and test["c"] < test["o"]
                          )

                      if confirmed:
                          retest_index = j
                          break

                  if retest_index is None:
                      i += 1
                      continue

                  # Entry is the next candle's opening price
                  entry_index = retest_index + 1
                  entry = history[entry_index]["o"]
                  retest = history[retest_index]

                  stop_buffer = max(
                      0.02,
                      0.05 * atr_at(history, retest_index)
                  )

                  if direction == "BUY":
                      sl = retest["l"] - stop_buffer
                      risk = entry - sl
                      tp = entry + reward_risk * risk
                  else:
                      sl = retest["h"] + stop_buffer
                      risk = sl - entry
                      tp = entry - reward_risk * risk

                  if risk <= 0:
                      i = entry_index + 1
                      continue

                  last_exit = entry_index + holding_bars
                  outcome = None

                  # Conservative rule:
                  # if stop and target are both touched in one
                  # candle, count the stop first.
                  for k in range(entry_index, last_exit + 1):
                      future = history[k]

                      if direction == "BUY":
                          hit_sl = future["l"] <= sl
                          hit_tp = future["h"] >= tp
                      else:
                          hit_sl = future["h"] >= sl
                          hit_tp = future["l"] <= tp

                      if hit_sl:
                          outcome = -1.0
                          break

                      if hit_tp:
                          outcome = reward_risk
                          break

                  # Exit at the end of the holding period
                  # if neither stop nor target was touched.
                  if outcome is None:
                      final_close = history[last_exit]["c"]

                      if direction == "BUY":
                          outcome = (final_close - entry) / risk
                      else:
                          outcome = (entry - final_close) / risk

                  results.append(outcome)

                  # Avoid overlapping experimental trades
                  i = max(i + 1, last_exit + 1)

              return results

          btb_results = btb_backtest(closed_bars)

          if btb_results:
              wins = sum(x > 0 for x in btb_results)
              losses = sum(x < 0 for x in btb_results)

              win_rate = 100 * wins / len(btb_results)

              gross_profit = sum(
                  x for x in btb_results if x > 0
              )

              gross_loss = abs(sum(
                  x for x in btb_results if x < 0
              ))

              profit_factor = (
                  gross_profit / gross_loss
                  if gross_loss > 0
                  else None
              )

              avg_r = sum(btb_results) / len(btb_results)

              pf_text = (
                  f"{profit_factor:.2f}"
                  if profit_factor is not None
                  else "N/A"
              )

              print(
                  f"BTB LAB V0 | "
                  f"Trades={len(btb_results)} | "
                  f"Wins={wins} | Losses={losses} | "
                  f"WinRate={win_rate:.1f}% | "
                  f"ProfitFactor={pf_text} | "
                  f"AvgR={avg_r:.2f} | "
                  f"Costs=NOT_INCLUDED"
              )

              if len(btb_results) < 30:
                  print(
                      "BTB NOTICE | Small sample; "
                      "do not treat this as reliable proof "
                      "of profitability."
                  )

          else:
              print(
                  "BTB LAB V0 | No completed test trades "
                  "in the available candle window."
              )

          # =========================
          # MAIN BUY SCORE
          # =========================

          buy_score = 0

          if close > ema200:
              buy_score += 20

          if m15_trend == "BULLISH":
              buy_score += 20

          if r >= 52:
              buy_score += 15

          if bull_bos:
              buy_score += 25

          if fvg_bull:
              buy_score += 10

          if bull_ob:
              buy_score += 10

          # =========================
          # MAIN SELL SCORE
          # =========================

          sell_score = 0

          if close < ema200:
              sell_score += 20

          if m15_trend == "BEARISH":
              sell_score += 20

          if r <= 48:
              sell_score += 15

          if bear_bos:
              sell_score += 25

          if fvg_bear:
              sell_score += 10

          if bear_ob:
              sell_score += 10

          # =========================
          # DIAGNOSTICS
          # =========================

          print(
              f"BUY CHECK | Score={buy_score}/100 | "
              f"EMA={'YES' if close > ema200 else 'NO'} | "
              f"M15={'YES' if m15_trend == 'BULLISH' else 'NO'} | "
              f"RSI={'YES' if r >= 52 else 'NO'} | "
              f"BOS={'YES' if bull_bos else 'NO'} | "
              f"FVG={'YES' if fvg_bull else 'NO'} | "
              f"OB={'YES' if bull_ob else 'NO'}"
          )

          print(
              f"SELL CHECK | Score={sell_score}/100 | "
              f"EMA={'YES' if close < ema200 else 'NO'} | "
              f"M15={'YES' if m15_trend == 'BEARISH' else 'NO'} | "
              f"RSI={'YES' if r <= 48 else 'NO'} | "
              f"BOS={'YES' if bear_bos else 'NO'} | "
              f"FVG={'YES' if fvg_bear else 'NO'} | "
              f"OB={'YES' if bear_ob else 'NO'}"
          )

          # =========================
          # MAIN SIGNAL
          # Existing score thresholds preserved
          # =========================

          signal = "WAIT"
          entry = close
          sl = None
          tp1 = None
          tp2 = None
          score = 0

          if (
              buy_score >= 75
              and close > ema200
              and m15_trend == "BULLISH"
              and r >= 52
              and sum([
                  bull_bos,
                  fvg_bull,
                  bool(bull_ob)
              ]) >= 2
          ):
              signal = "BUY"
              score = buy_score

              ob_low = (
                  bull_ob["l"] if bull_ob else close
              )

              sl = min(
                  ob_low,
                  close - 1.5 * a
              ) - 0.02

              risk = close - sl

              if risk > 0:
                  tp1 = close + risk
                  tp2 = close + 2 * risk
              else:
                  signal = "WAIT"

          elif (
              sell_score >= 75
              and close < ema200
              and m15_trend == "BEARISH"
              and r <= 48
              and sum([
                  bear_bos,
                  fvg_bear,
                  bool(bear_ob)
              ]) >= 2
          ):
              signal = "SELL"
              score = sell_score

              ob_high = (
                  bear_ob["h"] if bear_ob else close
              )

              sl = max(
                  ob_high,
                  close + 1.5 * a
              ) + 0.02

              risk = sl - close

              if risk > 0:
                  tp1 = close - risk
                  tp2 = close - 2 * risk
              else:
                  signal = "WAIT"

          # =========================
          # FINAL VALIDATION
          # =========================

          if signal != "WAIT":
              if sl is None or tp1 is None or tp2 is None:
                  signal = "WAIT"

          # =========================
          # TELEGRAM
          # Only the existing main signal sends messages
          # =========================

          if signal != "WAIT":
              msg = (
                  f"BARDIA AI\n"
                  f"🚨 {signal} XAUUSD M5\n\n"
                  f"Entry: {entry:.2f}\n"
                  f"SL: {sl:.2f}\n"
                  f"TP1: {tp1:.2f}\n"
                  f"TP2: {tp2:.2f}\n"
                  f"RR: 1:2\n"
                  f"Strength: {score}/100\n"
                  f"RSI: {r:.1f}\n"
                  f"EMA200: {ema200:.2f}\n"
                  f"M15: {m15_trend}"
              )

              tg_url = (
                  f"https://api.telegram.org/"
                  f"bot{token}/sendMessage"
              )

              tg_response = requests.post(
                  tg_url,
                  data={
                      "chat_id": chat_id,
                      "text": msg
                  },
                  timeout=30
              )

              tg_response.raise_for_status()
              tg_result = tg_response.json()

              if not tg_result.get("ok"):
                  raise Exception(
                      "Telegram error: " + str(tg_result)
                  )

              print(msg)

          else:
              print(
                  f"WAIT | Entry={close:.2f} | "
                  f"RSI={r:.1f} | "
                  f"EMA200={ema200:.2f} | "
                  f"M15={m15_trend} | "
                  f"M15_Close={m15_close:.2f} | "
                  f"M15_EMA50={m15_ema50:.2f}"
              )

          PY
